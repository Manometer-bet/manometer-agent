<!doctype html>
<html lang="de"><head><meta charset="utf-8" /><title>Manometer Agent</title>
<style>
  :root { color-scheme: dark; }
  body { font: 13px/1.55 -apple-system, system-ui, sans-serif; background: #14161a; color: #e6e8ec; margin: 0; padding: 18px; min-width: 520px; }
  h1 { font-size: 16px; margin: 0 0 2px; } h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #8b93a1; margin: 20px 0 8px; }
  .sub { color: #8b93a1; }
  .card { background: #191c22; border: 1px solid #272c35; border-radius: 9px; padding: 14px; margin-bottom: 12px; }
  .st { padding: 10px 12px; border-radius: 7px; margin-bottom: 12px; font-weight: 500; }
  .st.ok { background: #14331f; color: #7fd6a0; } .st.bad { background: #3a2020; color: #e8a0a0; } .st.warn { background: #3a3320; color: #e8cf9f; }
  .big { display: flex; align-items: center; gap: 12px; }
  .switch { position: relative; width: 52px; height: 28px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #3a4050; border-radius: 28px; cursor: pointer; transition: .15s; }
  .slider:before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  input:checked + .slider { background: #2f9e58; } input:checked + .slider:before { transform: translateX(24px); }
  .bk { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #22262e; }
  .bk:last-child { border-bottom: 0; }
  .bk .name { flex: 1; font-weight: 500; }
  .bk .det { color: #79808d; font-size: 11.5px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
  .row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dotted #23272f; }
  .row span:last-child { color: #e6e8ec; font-variant-numeric: tabular-nums; }
  .row span:first-child { color: #8b93a1; }
  pre { background: #101216; border: 1px solid #232830; border-radius: 7px; padding: 9px; max-height: 200px; overflow: auto; font-size: 11px; white-space: pre-wrap; }
  button { background: #262b34; border: 0; border-radius: 6px; color: #e6e8ec; padding: 7px 13px; font: inherit; cursor: pointer; }
  a.btn { display:inline-block; text-decoration:none; background:#2b6cb0; color:#fff; border-radius:6px; padding:7px 13px; }
  .hint { color: #79808d; font-size: 11.5px; margin-top: 8px; }
</style></head>
<body>
  <h1>Manometer Agent <span id="ver" class="sub"></span></h1>
  <div class="sub" id="who">—</div>

  <div id="connSt" class="st" style="margin-bottom:6px">…</div>
  <div id="mainSt" class="st bad">…</div>
  <div id="hinweise" style="margin-top:6px"></div>

  <div class="card">
    <div class="big">
      <label class="switch"><input id="onOff" type="checkbox" /><span class="slider"></span></label>
      <div><div style="font-weight:600" id="txPlace"></div><div class="sub" id="txPlaceSub"></div></div>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top:0" id="txBooks"></h2>
    <div id="books"></div>
    <div class="hint" id="txBooksHint"></div>
  </div>

  <div class="card">
    <h2 style="margin-top:0"><span id="txCfg"></span></h2>
    <div class="hint" id="txCfgSub" style="margin:0 0 8px"></div>
    <div class="grid" id="cfg"></div>
  </div>
  <div class="card">
    <h2 style="margin-top:0" id="txLim"></h2>
    <div class="hint" id="txLimHint" style="margin:0 0 8px"></div>
    <div class="row"><span id="txLimBet"></span><input id="limBet" inputmode="decimal" style="width:90px" /></div>
    <div class="row"><span id="txLimDay"></span><input id="limDay" inputmode="decimal" style="width:90px" /></div>
    <div style="margin-top:8px"><button id="limSave"></button> <span class="hint" id="limMsg"></span></div>
  </div>

  <div class="card">
    <h2 style="margin-top:0" id="txKonto"></h2>
    <div class="hint" id="txKontoHint" style="margin:0 0 8px"></div>
    <div style="display:flex;gap:10px;align-items:center"><label class="switch"><input id="kontoAn" type="checkbox" /><span class="slider"></span></label><div style="font-weight:600" id="txKontoAn"></div></div>
    <div class="hint" id="kontoSt" style="margin-top:8px"></div>
  </div>
  <div class="card">
    <h2 style="margin-top:0" id="txLog"></h2>
    <a class="btn" href="betlog.html" target="_blank" id="txLogOpen"></a>
    <span class="hint" id="logHint" style="margin-left:10px"></span>
    <button id="copyLog" style="float:right;font:inherit;padding:4px 10px;border-radius:6px;border:0;background:#2b6cb0;color:#fff;cursor:pointer"></button>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Edge Board</h2>
    <a class="btn" id="openBoard" href="#" target="_blank" rel="noopener"></a>
    <span class="hint" id="boardHint" style="margin-left:10px"></span>
  </div>

  <h2 id="txAct"></h2>
  <pre id="log">—</pre>
  <div style="margin-top:10px"><button id="run"></button> <a class="hint" id="txHelp" href="https://app.manometer.bet/login.html" target="_blank" rel="noopener" style="margin-left:10px"></a></div>
  <script src="options.js"></script>
</body></html>
